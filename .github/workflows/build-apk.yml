name: Build Screen Factory APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Build installable APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DialHealthScreenFactory.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DialHealthScreenFactory-APK
          path: DialHealthScreenFactory.apk
          if-no-files-found: error
          retention-days: 30
      - name: Android 16 launcher smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r DialHealthScreenFactory.apk
            adb logcat -c
            adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER zw.co.dialhealth.screenfactory.mobile | grep -q "zw.co.dialhealth.screenfactory.MainActivity"
            adb shell am start -n zw.co.dialhealth.screenfactory.mobile/zw.co.dialhealth.screenfactory.MainActivity
            sleep 3
            if adb logcat -d | grep -E "FATAL EXCEPTION.*zw.co.dialhealth.screenfactory.mobile|Process: zw.co.dialhealth.screenfactory.mobile"; then exit 1; fi
