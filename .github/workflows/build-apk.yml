name: Build Screen Factory APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build installable APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n zw.co.dialhealth.screenfactory/.MainActivity | tee /tmp/launch.txt
            grep -q "Status: ok" /tmp/launch.txt
            sleep 6
            adb shell dumpsys activity activities | grep -q "zw.co.dialhealth.screenfactory/.MainActivity"
            if adb logcat -d | grep -E "FATAL EXCEPTION.*zw.co.dialhealth.screenfactory|Process: zw.co.dialhealth.screenfactory"; then exit 1; fi
      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DialHealthScreenFactory.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DialHealthScreenFactory-APK
          path: DialHealthScreenFactory.apk
          if-no-files-found: error
          retention-days: 30
