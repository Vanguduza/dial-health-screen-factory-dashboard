name: Build Screen Factory APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build installable APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DialHealthScreenFactory.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DialHealthScreenFactory-APK
          path: DialHealthScreenFactory.apk
          if-no-files-found: error
          retention-days: 30
