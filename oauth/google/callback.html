<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>Return to Dial Health</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,sans-serif;background:linear-gradient(160deg,#e8f7f4,#f8fafc 60%);color:#102033}.card{width:min(520px,100%);background:#fff;border:1px solid #dbe5ea;border-radius:24px;padding:26px;box-shadow:0 18px 54px rgba(15,35,55,.12)}.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#0f766e;font-weight:900}h1{font-size:26px;margin:8px 0}.muted{color:#64748b;font-size:13px;line-height:1.55}.btn{display:inline-flex;margin-top:15px;background:#0f766e;color:#fff;text-decoration:none;border-radius:12px;padding:11px 15px;font-weight:850}</style></head><body><div class="card"><div class="brand">Dial Health · Google Drive</div><h1>Returning to Screen Factory…</h1><div id="copy" class="muted">Google authorization was received. Reopening the Screen Factory app to finish secure server-side storage.</div><a id="open" class="btn" href="#">Open Screen Factory</a></div><script>const q=new URLSearchParams(location.search),out=new URLSearchParams();for(const k of ['code','state','error']){const v=q.get(k);if(v)out.set(k,v)}const target='dialhealthscreenfactory://oauth/google?'+out.toString();document.getElementById('open').href=target;if(q.get('error'))document.getElementById('copy').textContent='Google returned: '+q.get('error')+'. Return to Screen Factory to retry.';setTimeout(()=>location.replace(target),250);</script></body></html>
